<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Settings – VerifyAI</title></head><body data-page="settings"><div class="app"><aside id="side" data-on="Settings"></aside><main class="main"><div class="top"><button class="ham">☰</button></div><h2>Settings</h2><div class="sub">Configure the VerifyAI frontend for this browser.</div><div class="card settings-card"><h3>Appearance</h3><label class="setting-row"><span><b>Dark Mode</b><small>Use a darker interface for the dashboard.</small></span><input type="checkbox" id="darkMode"></label></div><div class="card settings-card"><h3>Verification</h3><label class="setting-row"><span><b>Maximum documents</b><small>Backend currently supports up to 5 documents.</small></span><select id="maxDocuments"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label></div><div class="card settings-card"><h3>Backend</h3><label class="field-label">API Base URL</label><input class="settings-input" id="apiUrl" placeholder="http://127.0.0.1:8000"><div class="setting-status" id="apiStatus">Checking backend...</div><button class="btn" id="checkApi">Check Connection</button></div><div class="card settings-card"><h3>Data</h3><p class="mut">Verification history is stored locally in this browser.</p><button class="btn ghost" id="clearSettingsHistory">Clear Verification History</button></div><div class="settings-save"><button class="btn" id="saveSettings">Save Settings</button><span class="mut" id="savedMsg"></span></div></main></div><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/settings.js"></script></body></html>
